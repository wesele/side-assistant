name: CI & Architecture Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # 注意：不要给 checkout 开 lfs: true。
      # 模型合计约 299MB，GitHub 免费 LFS 带宽每月仅 1GB，每跑一次 CI 就会吃掉 299MB，
      # 三次运行即耗尽配额，之后 LFS 拉取会失败、CI 反而更不稳定。
      # 依赖真实模型的测试统一用 test/model_assets.dart 的 skipUnlessAsset() 显式跳过，
      # 报告里显示为 ~N（skipped），本地有模型时会正常执行。
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 注意：不要在这里安装 alsa-utils（arecord / amixer）。
      # 无头 runner 没有采集设备，装了之后 arecord 会启动但永远拿不到数据，
      # amixer 会挂到 2s 超时才返回，在 fake_async 的 widget 测试里留下
      # "A Timer is still pending" —— 反而制造出一批与被测代码无关的假失败。
      # 依赖 arecord 的用例由 test/env_capabilities.dart 的
      # skipUnlessLinuxExecutable('arecord') 在缺该命令时显式跳过（报告显示 ~N）。

      - name: Format Gate
        run: dart format --output=none --set-exit-if-changed lib test tool bin

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Architecture & Dependency Guard
        run: dart run tool/check_deps.dart

      - name: Run Unit & Concurrency Tests
        run: flutter test --exclude-tags benchmark

      - name: Verify Headless Server Pure-Dart Kernel Compilation
        run: dart compile kernel bin/linux_server.dart
