plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.sideassistant.side_assistant"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sideassistant.side_assistant"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 仅保留主流真机 arm64-v8a 架构
        ndk {
            abiFilters 'arm64-v8a'
        }

        // 仅保留中英文资源，裁剪第三方库携带的多国语言字符串
        resourceConfigurations += ['zh', 'en']
    }

    packaging {
        jniLibs {
            // 压缩 APK 内的 .so 动态库，显著减小安装包下载体积
            useLegacyPackaging = true
            // 安卓版已移除所有本地 ONNX 模型，同步剔除不再使用的 sherpa-onnx / onnxruntime 原生库
            excludes += [
                '**/libonnxruntime.so',
                '**/libsherpa-onnx-c-api.so',
                '**/libsherpa-onnx-cxx-api.so',
            ]
        }
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'LICENSE-junit.txt',
                'junit/**',
                '**/*.proto',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES',
                '/META-INF/{AL2.0,LGPL2.1}',
            ]
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

// 安卓打包时移除所有本地 AI 模型以及 Web/Windows 专属冗余资产（保留 pubspec.yaml 供桌面端与测试使用）
def androidPrunedAssetPaths = [
    'assets/models/sense-voice',
    'assets/models/streaming-zipformer',
    'assets/models/speaker',
    'assets/models/silero_vad.onnx',
    'assets/models/hr/README.md',
    'assets/scripts',
    'packages/sherpa_onnx_web',
    'packages/win_ble',
    'packages/cupertino_icons',
]

tasks.configureEach { task ->
    if (task.name ==~ /merge.*Assets/) {
        task.inputs.property('prunedFlutterAssets', androidPrunedAssetPaths.join(','))
        task.doLast {
            def flutterAssetsDir = new File(task.outputDir.get().asFile, 'flutter_assets')
            if (flutterAssetsDir.exists()) {
                androidPrunedAssetPaths.each { relPath ->
                    project.delete(new File(flutterAssetsDir, relPath))
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    // 后台拍照：CameraX 绑定到独立于 Activity 的生命周期宿主（见 BackgroundCameraController）
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    // ProcessCameraProvider.getInstance() 返回 Guava ListenableFuture
    implementation "com.google.guava:guava:33.4.0-android"
}
